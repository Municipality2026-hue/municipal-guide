name: Build Municipal Kiosk APK

on:
  push:
    branches: [main]
    paths:
      - 'android-kiosk/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android-kiosk
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: municipal-guide-kiosk-apk
          path: android-kiosk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK in repository
        run: |
          mkdir -p downloads
          cp android-kiosk/app/build/outputs/apk/debug/app-debug.apk downloads/municipal-guide-kiosk.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/municipal-guide-kiosk.apk
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish municipal kiosk Android APK"
          git push
