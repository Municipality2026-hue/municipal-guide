name: Publish municipal guide version 44

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-version-44.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply version 44
        shell: python
        run: |
          from pathlib import Path
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          rental_anchor = "    'إثبات التملك (الملكية) والرسم المساحي.',\n"
          rental_additions = rental_anchor + "    'مخالصة عقد إيجار في حال كان العقار مؤجرًا سابقًا.',\n    'شهادة إتمام بناء في حال لم يسبق تأجير العقار.',\n"
          if rental_additions not in text:
              if rental_anchor not in text:
                  raise SystemExit("Rental documents source was not found")
              text = text.replace(rental_anchor, rental_additions, 1)

          cancel_anchor = "  rentalCancellation.docs = [\n    'البطاقات الشخصية للطرفين.',\n"
          cancel_addition = cancel_anchor + "    'الوكالات الشرعية.',\n"
          if cancel_addition not in text:
              if cancel_anchor not in text:
                  raise SystemExit("Cancellation documents source was not found")
              text = text.replace(cancel_anchor, cancel_addition, 1)

          text = text.replace("الإصدار ٤١ — تدقيق مستندات عقد الإيجار", "الإصدار ٤٤ — استكمال مستندات توثيق عقد الإيجار", 1)
          path.write_text(text, encoding="utf-8")
      - name: Verify and commit
        run: |
          grep -F "الإصدار ٤٤ — استكمال مستندات توثيق عقد الإيجار" index.html
          grep -F "الوكالات الشرعية." index.html
          grep -F "مخالصة عقد إيجار في حال كان العقار مؤجرًا سابقًا." index.html
          grep -F "شهادة إتمام بناء في حال لم يسبق تأجير العقار." index.html
          git config user.name "Municipality Guide Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "نشر الإصدار 44 من دليل البلدية"
          git push
